<header class="site-header">
  <div class="site-header__zone site-header__zone--left">
    <nav class="site-header__nav" aria-label="Principal">
      @for (link of nav().navLeft; track link.path) {
        <a class="site-header__link" [routerLink]="'/' + link.path" routerLinkActive="is-active">
          {{ link.label }}
        </a>
      }

      <!-- Always rendered, even with zero entries (tasks.md Slice 3: "the
           dropdown renders zero entries until Slice 4 starts flipping routes
           live, then grows automatically with no further edits"). Keeping
           the trigger present rather than conditionally hidden also keeps
           its keyboard/ARIA wiring exercised by tests from day one. -->
      <div
        class="header-carta"
        [class.header-carta--open]="dropdownOpen()"
        (focusout)="onContainerFocusOut($event)"
      >
        <button
          type="button"
          class="site-header__link header-carta__trigger"
          [attr.aria-expanded]="dropdownOpen()"
          aria-controls="header-carta"
          (click)="toggleDropdown()"
          (keydown.escape)="closeAndReturnFocus()"
          (keydown.arrowdown)="openAndFocusFirstLink($event)"
          #cartaTrigger
        >
          Carta
        </button>
        <ul id="header-carta" class="header-carta__panel" #cartaPanel>
          @for (service of nav().dropdownServices; track service.path) {
            <li>
              <a
                class="header-carta__link"
                [routerLink]="'/' + service.path"
                (keydown.escape)="closeAndReturnFocus()"
              >
                {{ service.label }}
              </a>
            </li>
          }
        </ul>
      </div>
    </nav>
  </div>

  <a
    class="site-header__brand"
    routerLink="/"
    routerLinkActive="is-active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    {{ nav().wordmark.label }}
  </a>

  <div class="site-header__zone site-header__zone--right">
    @if (nav().reserveCta; as reserveCta) {
      <a class="site-header__cta" [routerLink]="'/' + reserveCta.path">{{ reserveCta.label }}</a>
    }
  </div>
</header>
