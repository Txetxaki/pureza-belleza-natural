@if (available()) {
  <pz-picture [base]="base()" [alt]="alt()" [width]="width()" [height]="height()" />
} @else {
  <div
    class="pz-photo-pending"
    [style.aspect-ratio]="aspectRatio()"
    role="img"
    [attr.aria-label]="alt() + ' — foto pendiente de la sesión'"
  >
    <p class="pz-photo-pending__label pz-eyebrow">Foto pendiente de la sesión</p>
  </div>
}
